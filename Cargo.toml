[package]
name = "membus"
version = "2.0.0"
edition = "2021"
rust-version = "1.85"
description = "Low-latency RocksDB-backed key/value resident, declarative indexes, embedded Tantivy search, signal ring, and multiplexed RPC/HTTP/WS/mTLS engine"

[features]
default = []
mesh-shm = ["zenoh/shared-memory"]

[dependencies]
axum = { version = "0.8.8", features = ["http2", "ws"] }
base64 = "0.22.1"
bytes = "1.12.2"
crc32fast = "1.5.2"
futures-util = "0.3.34"
parking_lot = "0.12.5"
ring = "0.17.14"
rocksdb = { version = "0.24", default-features = false, features = ["lz4", "zstd", "bindgen-runtime", "multi-threaded-cf"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1.14.0", features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
subtle = "2.6.1"
tantivy = { version = "=0.22.1", default-features = false, features = ["mmap", "stopwords", "lz4-compression"] }
thiserror = "2.0.21"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "signal"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12", "logging"] }
tower = "0.5.3"
tokio-stream = "0.1.19"
zenoh = { version = "=1.9.0", default-features = false, features = ["transport_tcp", "transport_quic"] }

[dev-dependencies]
http-body-util = "0.1.3"
hyper = { version = "1.8.1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
rcgen = "0.14.9"
tempfile = "3.27.0"
tokio-tungstenite = "0.27.0"

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unused_must_use = "warn"
missing_debug_implementations = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
missing_safety_doc = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
