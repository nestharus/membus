[package]
name = "membus"
version = "2.0.0"
edition = "2021"
rust-version = "1.85"
description = "Low-latency RocksDB-backed key/value resident, signal ring, and multiplexed RPC engine"

[dependencies]
bytes = "1.12.2"
crc32fast = "1.5.2"
parking_lot = "0.12.5"
rocksdb = { version = "0.24", default-features = false, features = ["lz4", "zstd", "bindgen-runtime", "multi-threaded-cf"] }
thiserror = "2.0.21"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "signal"] }

[dev-dependencies]
tempfile = "3.27.0"
