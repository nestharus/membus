apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/name: membus
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false

resources:
  - deployment.yaml
  - service.yaml

# Release overlays pin immutable digests here without modifying base manifests:
# images:
#   - name: ghcr.io/oulipoly/membus
#     newTag: v2.0.0
#     digest: sha256:<published-release-digest>
images:
  - name: ghcr.io/oulipoly/membus
    newTag: v2.0.0
