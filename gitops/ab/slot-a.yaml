apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: membus-data-slot-a
  labels:
    app.kubernetes.io/name: membus
    app.kubernetes.io/component: storage-resident
    membus.oulipoly.io/slot: slot-a
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: membus-slot-a
  labels:
    app.kubernetes.io/name: membus
    app.kubernetes.io/component: storage-resident
    membus.oulipoly.io/slot: slot-a
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: membus
      membus.oulipoly.io/slot: slot-a
  template:
    metadata:
      labels:
        app.kubernetes.io/name: membus
        app.kubernetes.io/component: storage-resident
        membus.oulipoly.io/slot: slot-a
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: membus
          image: ghcr.io/oulipoly/membus-slot-a:v2.0.0
          imagePullPolicy: IfNotPresent
          args:
            - serve
            - --data-dir
            - /var/lib/membus
            - --checkpoint-root
            - /var/lib/membus/checkpoints
            - --http-listen
            - 0.0.0.0:8443
            - --http-tls-cert
            - /etc/membus/tls/tls.crt
            - --http-tls-key
            - /etc/membus/tls/tls.key
            - --auth-config
            - /etc/membus/auth/auth.json
            - --public-health-probe
            - --node-id
            - slot-a
            - --slot-role
            - active
            - --max-http-in-flight
            - "1024"
            - --max-active-streams
            - "1024"
            - --max-active-snapshots
            - "1024"
            - --query-timeout-ms
            - "30000"
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /v2/health
              port: https
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /v2/health
              port: https
              scheme: HTTPS
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /var/lib/membus
            - name: tls
              mountPath: /etc/membus/tls
              readOnly: true
            - name: auth
              mountPath: /etc/membus/auth
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: membus-data-slot-a
        - name: tls
          secret:
            secretName: membus-slot-a-tls
            defaultMode: 0440
        - name: auth
          secret:
            secretName: membus-slot-a-auth
            defaultMode: 0440
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: membus-slot-a
  labels:
    app.kubernetes.io/name: membus
    app.kubernetes.io/component: storage-resident
    membus.oulipoly.io/slot: slot-a
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: membus
    membus.oulipoly.io/slot: slot-a
  ports:
    - name: https
      port: 8443
      targetPort: https
      protocol: TCP
