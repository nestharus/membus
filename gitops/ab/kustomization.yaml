apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/part-of: membus-ab
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false

resources:
  - slot-a.yaml
  - slot-b.yaml
  - ab-router.yaml
  - networkpolicy.yaml

# Base Kustomize template for dual-slot A/B deployments (NOT directly deployable as-is).
#
# IMPORTANT: Do NOT collapse `membus-slot-a`, `membus-slot-b`, and `membus-ab-router` into a
# single shared image name in this base! Keeping the three distinct placeholder names intact
# ensures every environment overlay can pin an independent immutable `@sha256:` digest per
# component (allowing Slot B to advance while Slot A and the rollback digest remain pinned).
#
# Environment overlay example (`overlays/<env>/kustomization.yaml`):
#
# resources:
#   - ../../gitops/ab
# images:
#   - name: ghcr.io/oulipoly/membus-slot-a
#     newName: ghcr.io/oulipoly/membus
#     digest: sha256:<slot-a-pinned-release-digest>
#   - name: ghcr.io/oulipoly/membus-slot-b
#     newName: ghcr.io/oulipoly/membus
#     digest: sha256:<slot-b-pinned-release-digest>
#   - name: ghcr.io/oulipoly/membus-ab-router
#     newName: ghcr.io/oulipoly/membus
#     digest: sha256:<ab-router-pinned-release-digest>
